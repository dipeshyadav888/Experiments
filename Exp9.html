<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment9</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Responsive Product Grid</h2>
    <div class="container">
        <div class="product">
            <div class="image image1">
                <img src="https://via.placeholder.com/150" alt="Product 1">
            </div>
            <div class="item item1">
                <h3>Product 1</h3>
                <p>High quality item with great features.<br>₹400</p>
            </div>
        </div>
        <div class="product">
            <div class="image image2">
                <img src="https://via.placeholder.com/150" alt="Product 2">
            </div>
            <div class="item item2">
                <h3>Product 2</h3>
                <p>Durable and stylish for daily use.<br>₹799</p>
            </div>
        </div>
        <div class="product">
            <div class="image image3">
                <img src="https://via.placeholder.com/150" alt="Product 3">
            </div>
            <div class="item item3">
                <h3>Product 3</h3>
                <p>Lightweight and comfortable.<br>₹1299</p>
            </div>
        </div>
        <div class="product">
            <div class="image image4">
                <img src="https://via.placeholder.com/150" alt="Product 4">
            </div>
            <div class="item item4">
                <h3>Product 4</h3>
                <p>Trendy design with premium quality.<br>₹999</p>
            </div>
        </div>
    </div>
</body>

</html>
