<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 8</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #navbar {
      border: 2px solid black;
      background-color: white;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
    }

    #card {
      border: 2px solid whitesmoke;
      border-radius: 5%;
      margin-top: 20px;
      margin-bottom: 20px;
      padding: 0px 0px 0px 30px;
      text-align: center;
      box-shadow: 2px 2px 10px lightgrey;
      width: 300px;
    }

    #circle {
      height: 80px;
      width: 80px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-items: center;
      justify-self: center;
      justify-content: space-evenly;
      font-size: larger;
      font-weight: bold;
      background-color: blue;
      color: white;
      text-align: center;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <div id="navbar">
    <div id="card">
      <div id="circle">JK</div>
      <h3>Jeet Kumar</h3>
      <p>B.Tech-CSE <br>
        Roll No. 21CS1007<br>
        1st Year</p>
    </div>
    <div id="card">
      <div id="circle">AR</div>
      <h3>Asha Rani</h3>
      <p>B.Tech-IT<br>
        Roll No. 21IT1012<br>
        1st Year</p>
    </div>
    <div id="card">
      <div id="circle">RK</div>
      <h3>Rohit Kumar</h3>
      <p>B.Tech-ECE<br>
        Roll No. 21EC1009<br>
        1st Year</p>
    </div>
  </div>
</body>

</html>
