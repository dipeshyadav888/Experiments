<!DOCTYPE html>
<html>
<head>
    <title>School Result Table</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        caption {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<table>
    <caption>Class 10 School Result 2026</caption>

    <tr>
        <th rowspan="2">Roll No</th>
        <th rowspan="2">Student Name</th>
        <th colspan="3">Marks</th>
        <th rowspan="2">Total</th>
        <th rowspan="2">Result</th>
    </tr>

    <tr>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
    </tr>

    </tr>

</table>

</body>
</html>
